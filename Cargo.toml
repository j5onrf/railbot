[package]
name = "railbot"
version = "0.5.3"
edition = "2021"

[lib]
name = "railbot"
path = "src/lib.rs"

[[bin]]
name = "railbot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
eventsource-stream = "0.2"
futures-util = "0.3"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
